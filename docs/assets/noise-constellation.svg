<svg xmlns="http://www.w3.org/2000/svg" width="760" height="320" viewBox="0 0 760 320" role="img" aria-labelledby="csTitle csDesc" font-family="'JetBrains Mono', Consolas, monospace">
  <title id="csTitle">noisescope handshake state machine</title>
  <desc id="csDesc">The noise-XX abstract state machine drawn as four states connected by transitions. A pulse walks the legal path from await_e to established as a conforming transcript is replayed. Structural only, not a cryptographic claim.</desc>

  <rect width="760" height="320" fill="#0b1220"/>

  <!-- transition edges (the legal path) -->
  <g stroke="#33507a" stroke-width="2" fill="none">
    <line x1="140" y1="180" x2="320" y2="120"/>
    <line x1="320" y1="120" x2="500" y2="210"/>
    <line x1="500" y1="210" x2="660" y2="150"/>
  </g>

  <!-- edge labels: the abstract messages -->
  <g fill="#8697b3" font-size="10.5" text-anchor="middle">
    <text x="230" y="140">initiator:e</text>
    <text x="410" y="180">responder:e_ee_s_es</text>
    <text x="590" y="170">initiator:s_se</text>
  </g>

  <!-- travelling pulse along the path, shows the replay walking states -->
  <circle r="5" fill="#3fb950">
    <animateMotion dur="4.2s" repeatCount="indefinite" path="M140,180 L320,120 L500,210 L660,150"/>
  </circle>

  <!-- state nodes -->
  <g font-size="12" text-anchor="middle">
    <g>
      <circle cx="140" cy="180" r="9" fill="#0b1220" stroke="#5b9bd5" stroke-width="2.5"/>
      <text x="140" y="208" fill="#c7d3e6">await_e</text>
      <text x="140" y="222" fill="#5d708f" font-size="9">initial</text>
    </g>
    <circle cx="320" cy="120" r="9" fill="#0b1220" stroke="#5b9bd5" stroke-width="2.5"/>
    <text x="320" y="104" fill="#c7d3e6">await_ee</text>
    <circle cx="500" cy="210" r="9" fill="#0b1220" stroke="#5b9bd5" stroke-width="2.5"/>
    <text x="500" y="236" fill="#c7d3e6">await_se</text>
    <g>
      <circle cx="660" cy="150" r="11" fill="#0b1220" stroke="#3fb950" stroke-width="2.5"/>
      <circle cx="660" cy="150" r="6" fill="none" stroke="#3fb950" stroke-width="1.5"/>
      <text x="660" y="128" fill="#3fb950">established</text>
      <text x="660" y="176" fill="#5d708f" font-size="9">accepting</text>
    </g>
  </g>

  <text x="24" y="34" font-size="16" fill="#5b9bd5">noisescope . noise-XX state machine</text>
  <text x="24" y="52" font-size="10.5" fill="#5d708f">a transcript is one lit path across the states. structural, not a cryptographic proof.</text>
</svg>

