<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" role="img" aria-labelledby="dvTitle dvDesc" font-family="'JetBrains Mono', Consolas, monospace">
  <title id="dvTitle">noisescope divergence instrument</title>
  <desc id="dvDesc">An instrument panel comparing two handshake traces. The green line is a conforming baseline; the amber line is the same transcript after a minimized mutation. Where they part, a red marker sits at the divergence point. This is structural analysis, not a cryptographic proof.</desc>

  <rect width="760" height="360" fill="#0b1220"/>

  <!-- instrument frame -->
  <g stroke="#1b2b45" stroke-width="1">
    <line x1="60" y1="70" x2="60" y2="300"/>
    <line x1="60" y1="300" x2="720" y2="300"/>
    <line x1="60" y1="185" x2="720" y2="185" stroke-dasharray="3,7" stroke="#16223a"/>
    <line x1="200" y1="70" x2="200" y2="300" stroke="#12203a"/>
    <line x1="340" y1="70" x2="340" y2="300" stroke="#12203a"/>
    <line x1="480" y1="70" x2="480" y2="300" stroke="#12203a"/>
    <line x1="620" y1="70" x2="620" y2="300" stroke="#12203a"/>
  </g>

  <!-- event tick labels -->
  <g fill="#5d708f" font-size="10" text-anchor="middle">
    <text x="60" y="316">e0</text>
    <text x="200" y="316">e1</text>
    <text x="340" y="316">e2</text>
    <text x="480" y="316">e3</text>
    <text x="620" y="316">e4</text>
  </g>

  <!-- baseline (conforming) trace, drawn on -->
  <polyline points="60,260 200,200 340,140 480,120 620,100" fill="none" stroke="#3fb950" stroke-width="2.5" stroke-dasharray="900" stroke-dashoffset="900">
    <animate attributeName="stroke-dashoffset" from="900" to="0" dur="2.4s" fill="freeze"/>
  </polyline>

  <!-- mutated (diverging) trace -->
  <polyline points="60,260 200,200 340,215 480,255 620,285" fill="none" stroke="#d68a1a" stroke-width="2.5" stroke-dasharray="7,7">
    <animate attributeName="stroke-dashoffset" values="0;-56" dur="1.2s" repeatCount="indefinite"/>
  </polyline>

  <!-- divergence marker where the traces split -->
  <g transform="translate(340,185)">
    <circle r="6" fill="#e5484d"/>
    <line x1="0" y1="-46" x2="0" y2="46" stroke="#e5484d" stroke-width="1" stroke-dasharray="2,4"/>
    <text x="12" y="-8" font-size="11" fill="#e5484d">divergence</text>
    <text x="12" y="6" font-size="9.5" fill="#b06a6c">minimized mutation</text>
  </g>

  <!-- legend -->
  <g font-size="11">
    <rect x="60" y="322" width="18" height="4" fill="#3fb950"/>
    <text x="84" y="327" fill="#8697b3">baseline (conforms)</text>
    <rect x="300" y="322" width="18" height="4" fill="#d68a1a"/>
    <text x="324" y="327" fill="#8697b3">mutated (diverges)</text>
  </g>

  <text x="24" y="34" font-size="16" fill="#5b9bd5">noisescope . divergence instrument</text>
  <text x="24" y="52" font-size="10.5" fill="#5d708f">baseline vs minimized mutation. structural analysis, not a cryptographic proof.</text>
</svg>

