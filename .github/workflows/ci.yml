name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: rust core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt clippy
      - name: Format check
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Build
        run: cargo build --release --verbose
      - name: Test
        run: cargo test --verbose
      - name: Fixture smoke tests
        run: |
          set -e
          cargo run --quiet -- lint fixtures/noise-xx.protocol.json
          cargo run --quiet -- lint fixtures/tls13.protocol.json
          cargo run --quiet -- lint fixtures/mls.protocol.json
          # conforming transcripts exit 0
          cargo run --quiet -- check fixtures/noise-xx.protocol.json fixtures/noise-xx.ok.transcript.json
          cargo run --quiet -- check fixtures/tls13.protocol.json fixtures/tls13.ok.transcript.json
          cargo run --quiet -- check fixtures/mls.protocol.json fixtures/mls.ok.transcript.json
          # diverging transcript must exit non-zero
          if cargo run --quiet -- check fixtures/tls13.protocol.json fixtures/tls13.reorder.transcript.json; then
            echo "expected reorder transcript to diverge"; exit 1
          fi

  viewer:
    name: typescript viewer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        working-directory: viewer
        run: npm install --no-audit --no-fund
      - name: Type-check
        working-directory: viewer
        run: npm run check
      - name: Build
        working-directory: viewer
        run: npm run build
      - name: Test
        working-directory: viewer
        run: npm test
