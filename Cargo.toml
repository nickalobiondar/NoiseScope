[package]
name = "noisescope"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "A cryptographic handshake transcript state-machine analyzer and fuzzer (not a cryptographic proof tool)."
license = "MIT"
readme = "README.md"
repository = "https://example.invalid/noisescope"
keywords = ["handshake", "state-machine", "fuzzer", "protocol", "analyzer"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "noisescope"
path = "src/main.rs"

[lib]
name = "noisescope"
path = "src/lib.rs"

[profile.release]
opt-level = 3
lto = "thin"
panic = "abort"

# noisescope intentionally depends on the Rust standard library only.
# No third-party crates are used, by design (auditability + reproducibility).
[dependencies]
